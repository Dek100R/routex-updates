name: Auto Update JSON on Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse Release Data
        id: release_data
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"
          VERSION="${TAG_NAME#v}"
          
          APK_URL=$(echo '${{ toJson(github.event.release.assets) }}' | jq -r '.[] | select(.name | endswith(".apk")) | .browser_download_url' | head -n 1)
          
          if [ -z "$APK_URL" ] || [ "$APK_URL" = "null" ]; then
            echo "Error: No APK asset found in the release!"
            exit 1
          fi
          
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "APK_URL=$APK_URL" >> $GITHUB_ENV

      - name: Update update.json
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          jq -n \
            --arg ver "${{ env.VERSION }}" \
            --arg url "${{ env.APK_URL }}" \
            --arg notes "$RELEASE_BODY" \
            '{version: $ver, url: $url, notes: $notes}' > update.json

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "chore: auto-update update.json to v${{ env.VERSION }}" || exit 0
          git push origin HEAD:main
